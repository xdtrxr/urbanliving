<!-- Square app icon derived from logo.svg.

     Source artwork is 4221x3663 (landscape). Favicons, apple-touch-icon and
     PWA icons all want a square, so this squares the canvas, paints the navy
     full-bleed, and centres the orange marks at 0.88 scale.

     Full-bleed with sharp corners is deliberate: "maskable" means the OS
     applies its own mask (circle on some Android launchers, squircle on
     others), so any rounding we baked in would leave transparent corners
     showing through. 0.88 keeps the marks inside the 80%-diameter safe
     zone those masks guarantee.

     Regenerate this whenever logo.svg changes. -->
