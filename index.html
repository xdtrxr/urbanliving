<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />

    <!-- PWA: install to home screen / desktop -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="UrbanStays" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UrbanStays" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="description" content="UrbanStays — verified short-stay apartments in Abuja and Lagos. Book directly with HOMESHARES." />

    <!-- Open Graph / social previews -->
    <meta property="og:title" content="UrbanStays — Verified short-stay apartments in Nigeria" />
    <meta property="og:description" content="Find and book verified apartments in Abuja and Lagos. Powered by HOMESHARES." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://urbanstays.io" />
    <meta property="og:site_name" content="UrbanStays" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UrbanStays — Verified short-stay apartments in Nigeria" />
    <meta name="twitter:description" content="Find and book verified apartments in Abuja and Lagos. Powered by HOMESHARES." />

    <link rel="canonical" href="https://urbanstays.io" />

    <title>UrbanStays — Short-stay apartments in Abuja & Lagos</title>

    <!-- Apply the user's saved theme BEFORE React paints so the page never
         flashes light-then-dark on load. Same localStorage key the
         ThemeProvider uses; falls back to OS preference. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('urbanstays_theme');
          var pref = (stored === 'dark' || stored === 'light') ? stored : null;
          var resolved = pref || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0a0a0a' : '#0f172a');
        } catch (e) { /* default light is fine */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
